[package]
name = "tempest"
description = "Tempest, a peer-to-peer file sharing client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

# Released by dist despite `publish = false`, which only keeps it off crates.io.
[package.metadata.dist]
dist = true

[dependencies]
tempest-api = { workspace = true, features = ["client"] }
tempest-assets.workspace = true
tempest-tracker-api.workspace = true
tempest-core.workspace = true
tempest-engine.workspace = true
tempest-net.workspace = true
tempest-protocol.workspace = true
tempest-tui.workspace = true

anyhow.workspace = true
axum.workspace = true
clap.workspace = true
# The terminal's width, through crossterm, so the status line never wraps.
ratatui.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
unicode-width.workspace = true

[build-dependencies]
tempest-assets.workspace = true

[dev-dependencies]
tempest-api = { workspace = true, features = ["testing"] }
tempfile.workspace = true

[lints]
workspace = true
