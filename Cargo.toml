[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gregorybchris/tempest"
rust-version = "1.99"

[workspace.dependencies]
tempest-protocol = { path = "crates/protocol", version = "0.1.0" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
unicode-normalization = "0.1"

hex = "0.4"
proptest = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
