[package]
name = "tempest-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
libfuzzer-sys = "0.4"
serde = "1"
serde_json = "1"
tempest-catalog-api = { path = "../crates/catalog-api" }
tempest-core = { path = "../crates/core" }
tempest-engine = { path = "../crates/engine" }
tempest-net = { path = "../crates/net" }
tempest-protocol = { path = "../crates/protocol" }
tempest-sim = { path = "../crates/sim", default-features = false }
tempest-sim-api = { path = "../crates/sim-api" }
tempest-tracker = { path = "../crates/tracker" }

# Keep the fuzz crate out of the main workspace: it builds only on nightly.
[workspace]
members = ["."]

[[bin]]
name = "frame"
path = "fuzz_targets/frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "primitives"
path = "fuzz_targets/primitives.rs"
test = false
doc = false
bench = false

