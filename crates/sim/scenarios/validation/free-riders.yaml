# Choking serves peers that upload, so free riders download more slowly than under a
# cooperative strategy (Legout et al.). See crates/sim/tests/validation.rs.
name: free-riders
description: Fast and home peers and free riders fetch a release that arrives in a flash crowd.
duration: 30m
seeds: 10
bundle: { files: [{ size: 32MiB }] }
network: { latency: 25ms }
# Peers leave once complete, so free riders depend on peers that are still downloading.
settings: { overrides: { lingering.ratio: 0.01 } }
peers:
  - class: origin
    starts: complete
    bandwidth: { up: 20Mbps, down: 100Mbps }
  - class: fast
    count: 10
    bandwidth: { up: 50Mbps, down: 100Mbps }
    arrivals: { pattern: flash-crowd, decay: 30s }
  - class: home
    count: 60
    bandwidth: { up: 10Mbps, down: 50Mbps }
    arrivals: { pattern: flash-crowd, decay: 30s }
  - class: free-rider
    count: 20
    behavior: free-rider
    bandwidth: { up: 10Mbps, down: 50Mbps }
    arrivals: { pattern: flash-crowd, decay: 30s }
experiment:
  vary:
    strategies.upload: [bittorrent, cooperative]
