[package]
name = "tempest-sim"
description = "Tempest's discrete-event simulator: scenarios, a simulated network and experiment runs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["results"]
# The DuckDB results database (D-075). Off for builds that only need runs, such as fuzzing.
results = ["dep:duckdb"]

[dependencies]
tempest-core.workspace = true
tempest-protocol.workspace = true

duckdb = { workspace = true, optional = true }
rand.workspace = true
rand_chacha.workspace = true
serde.workspace = true
serde-saphyr.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
