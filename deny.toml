[graph]
all-features = true

[advisories]
version = 2
ignore = [
  # paste is finished rather than broken: a build-time macro with no known vulnerability, which
  # Leptos 0.8 (D-117) depends on.
  { id = "RUSTSEC-2024-0436", reason = "unmaintained build-time macro used by Leptos" },
]

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]
# encoding_rs (through serde-saphyr) includes WHATWG encoding data under BSD-3-Clause.
# DuckDB (D-075) brings the rest: hashing and compression crates, and through its build
# script's HTTP client (unused when bundled) the TLS stack and root certificates.
exceptions = [
  { allow = ["BSD-3-Clause"], crate = "encoding_rs" },
  { allow = ["Zlib"], crate = "foldhash" },
  { allow = ["Zlib"], crate = "zlib-rs" },
  { allow = ["CC0-1.0"], crate = "tiny-keccak" },
  { allow = ["BSD-3-Clause"], crate = "subtle" },
  { allow = ["ISC"], crate = "ring" },
  { allow = ["ISC"], crate = "rustls-webpki" },
  { allow = ["ISC"], crate = "untrusted" },
  { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
  # axum's router (trackers, D-043) and the platform verifier's fallback roots (D-177).
  { allow = ["BSD-3-Clause"], crate = "matchit" },
  { allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs" },
  # Leptos (D-117): its reactive arena, compile-time strings, hashing and hex encoding.
  { allow = ["Zlib"], crate = "slotmap" },
  { allow = ["Zlib"], crate = "const_format" },
  { allow = ["Zlib"], crate = "const_format_proc_macros" },
  { allow = ["Zlib"], crate = "konst" },
  { allow = ["Zlib"], crate = "konst_macro_rules" },
  { allow = ["BSL-1.0"], crate = "xxhash-rust" },
  { allow = ["CC0-1.0"], crate = "base16" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
