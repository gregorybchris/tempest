[package]
name = "server-app"
version = "0.1.0"
edition = "2021"
description = "M0 prototype: server-rendered Tempest UI (axum + maud + Datastar)"

[dependencies]
proto-core = { path = "../proto-core" }
maud = "0.27"
axum = "0.8"
tokio = { version = "1.53.2", features = ["full"] }
datastar = { version = "0.4.1", features = ["axum"] }
tokio-stream = "0.1.19"
serde = { version = "1.0.229", features = ["derive"] }
tower-http = { version = "0.7.1", features = ["compression-br", "compression-gzip"] }
