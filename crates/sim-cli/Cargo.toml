[package]
name = "tempest-sim-cli"
description = "tempest-sim, Tempest's simulator: runs scenarios, checks baselines and serves the results UI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "tempest-sim"
path = "src/main.rs"

[features]
# Compile DuckDB from its bundled source instead of linking the system library. For CI and
# release builds, so the shipped binary needs no DuckDB installed.
bundled-duckdb = ["tempest-sim/bundled-duckdb"]

# Releases bundle DuckDB (D-214).
# The simulator is a development tool, built from source rather than released (D-233).
[package.metadata.dist]
dist = false

[dependencies]
tempest-assets.workspace = true
tempest-sim.workspace = true
tempest-sim-api.workspace = true

anyhow.workspace = true
axum.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "signal"] }

[build-dependencies]
tempest-assets.workspace = true

[dev-dependencies]
tempfile.workspace = true
tower.workspace = true

[lints]
workspace = true
