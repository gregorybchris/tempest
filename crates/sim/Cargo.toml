[package]
name = "tempest-sim"
description = "Tempest's discrete-event simulator: scenarios, a simulated network and experiment runs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["results"]
# The DuckDB results database (D-075). Off for builds that only need runs, such as fuzzing.
results = ["dep:duckdb", "dep:tempest-sim-api"]
# Compile DuckDB from its bundled source instead of linking the system library, so the binary
# needs no DuckDB installed.
bundled-duckdb = ["results", "duckdb/bundled", "duckdb/json"]
# The database's DuckDB connection, for tests that check its tables with SQL.
testing = ["results"]

[dependencies]
tempest-core.workspace = true
tempest-protocol.workspace = true
tempest-sim-api = { workspace = true, optional = true }

duckdb = { workspace = true, optional = true }
libm.workspace = true
rand.workspace = true
rand_chacha.workspace = true
serde.workspace = true
serde-saphyr.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempest-sim = { workspace = true, features = ["testing"] }
duckdb.workspace = true
tempest-sim-api.workspace = true
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
