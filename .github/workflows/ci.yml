name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# CI has no system DuckDB, so every job that compiles tempest-sim builds the bundled one.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --features tempest-sim/bundled-duckdb -- -D warnings
      - run: cargo nextest run --workspace --features tempest-sim/bundled-duckdb
      - run: cargo test --workspace --doc --features tempest-sim/bundled-duckdb

  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p tempest-sim-cli --features bundled-duckdb
      # The same seed must replay the same event log (D-068), in a fresh process and whatever
      # the number of threads.
      - name: Determinism check
        run: |
          for path in crates/sim/scenarios/{swarm-1000,home-routers}.yaml crates/sim/scenarios/golden/*.yaml; do
            scenario=$(basename "$path" .yaml)
            target/release/tempest-sim run "$path" --no-db --digests "$scenario-1.tsv"
            target/release/tempest-sim run "$path" --no-db --digests "$scenario-2.tsv" --jobs 1
            cmp "$scenario-1.tsv" "$scenario-2.tsv"
            cat "$scenario-1.tsv"
          done
      # Every saved seed of every golden scenario, compared seed by seed (D-171). The check job
      # runs the quick version.
      - name: Golden baselines, long
        run: target/release/tempest-sim baseline --long
      # The slow tests, among them the 1,000-peer swarm into DuckDB and the validation scenarios.
      - name: Slow simulation tests
        run: cargo test --release -p tempest-sim --features tempest-sim/bundled-duckdb -- --include-ignored

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Installs the pinned toolchain with its WebAssembly target.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # The test runner must match the wasm-bindgen crate the lockfile has.
      - name: Find wasm-bindgen's version
        id: wasm-bindgen
        run: echo "version=$(cargo metadata --format-version 1 --locked | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }},trunk
      # The UI kit's and the web UIs' own tests use native-only crates, and run in the check job;
      # the gallery's are the browser benchmark.
      - run: cargo clippy --target wasm32-unknown-unknown -p tempest-ui-kit -p tempest-web -p tempest-sim-web -p tempest-tracker-web -- -D warnings
      - run: cargo clippy --target wasm32-unknown-unknown -p tempest-ui-gallery --all-targets -- -D warnings
      # The web UIs as releases embed them (D-201), then the binary serving them.
      - name: Build the web UI
        working-directory: crates/web
        run: trunk build --release --cargo-profile web
      - name: Build the simulation results UI
        working-directory: crates/sim-web
        run: trunk build --release --cargo-profile web
      - name: Build the tracker website
        working-directory: crates/tracker-web
        run: trunk build --release --cargo-profile web
      - run: cargo test -p tempest --test web
      - run: cargo test -p tempest-sim-cli --test sim_web --features bundled-duckdb
      # The tracker website in headless Chrome: search, filters and sign-in.
      - name: Tracker website browser test
        env:
          CHROMEDRIVER: ${{ env.CHROMEWEBDRIVER }}/chromedriver
        run: cargo test -p tempest --test tracker_web -- --ignored --nocapture
      # The 1,536-cell live view benchmark (specs/interfaces.md), in headless Chrome.
      - name: Live view benchmark
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
          CHROMEDRIVER: ${{ env.CHROMEWEBDRIVER }}/chromedriver
        run: cargo test --target wasm32-unknown-unknown -p tempest-ui-gallery -- --nocapture

  # The release targets that CI's Linux x86_64 jobs don't build (D-212). Windows and Linux on
  # arm64 swap in different code paths. The web UIs' output is absent, which the binary allows
  # (D-210).
  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p tempest --all-targets -- -D warnings
      - run: cargo test -p tempest-net -p tempest-engine

  # The release configuration and its generated workflow agree, and dist can plan a release.
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dist
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh"
      - run: dist generate --check
      - run: dist plan

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Run each fuzz target briefly
        working-directory: fuzz
        run: |
          targets=$(cargo +nightly fuzz list)
          test -n "$targets"
          # The prebuilt cargo-fuzz is a musl binary that defaults to its own target.
          host=$(rustc +nightly -vV | sed -n 's/^host: //p')
          for target in $targets; do
            cargo +nightly fuzz run --target "$host" "$target" -- -max_total_time=30
          done
