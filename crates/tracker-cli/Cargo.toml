[package]
name = "tempest-tracker-cli"
description = "tempest-tracker, Tempest's tracker: peer lists, listings with search, and the tracker's website"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "tempest-tracker"
path = "src/main.rs"

# Operators run servers on Unix, so there is no Windows build or MSI.
[package.metadata.dist]
dist = true
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
installers = ["shell"]

[dependencies]
tempest-assets.workspace = true
tempest-net.workspace = true
tempest-protocol.workspace = true
tempest-tracker.workspace = true
tempest-tracker-api.workspace = true

anyhow.workspace = true
clap.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing-subscriber.workspace = true

[build-dependencies]
tempest-assets.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
