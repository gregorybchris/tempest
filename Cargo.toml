[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/gregorybchris/tempest"
homepage = "https://github.com/gregorybchris/tempest"
authors = ["Chris Gregory"]
rust-version = "1.99"

[workspace.dependencies]
tempest-protocol = { path = "crates/protocol", version = "0.1.0" }
tempest-api = { path = "crates/api", version = "0.1.0" }
tempest-sim-api = { path = "crates/sim-api", version = "0.1.0" }
tempest-tracker-api = { path = "crates/tracker-api", version = "0.1.0" }
tempest-core = { path = "crates/core", version = "0.1.0" }
tempest-sim = { path = "crates/sim", version = "0.1.0" }
tempest-assets = { path = "crates/assets", version = "0.1.0" }
tempest-net = { path = "crates/net", version = "0.1.0" }
tempest-tracker = { path = "crates/tracker", version = "0.1.0" }
tempest-engine = { path = "crates/engine", version = "0.1.0" }
tempest-relay = { path = "crates/relay", version = "0.1.0" }
tempest-tui = { path = "crates/tui", version = "0.1.0" }
tempest-ui-kit = { path = "crates/ui-kit", version = "0.1.0" }

anyhow = "1"
# Local time for the alternative speed limits' schedule.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive", "env"] }
# Links the system DuckDB library (see specs/development.md); `tempest-sim/bundled-duckdb` compiles
# the bundled source instead.
duckdb = "1.10506"
# Seeds the tracker's peer sampler. Through rand it would give tempest-core OS randomness too.
getrandom = { version = "0.3", features = ["std"] }
# No default features: core must never reach for the OS's randomness (D-068).
rand = { version = "0.9", default-features = false, features = ["alloc"] }
rand_chacha = { version = "0.9", default-features = false }
# Bundled so no system SQLite is needed (D-082).
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Scenario files are only read; the engine also writes its config file.
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
sha2 = "0.10"
# The tracker catalog's search (D-130), in memory: no mmap, compression or stemmers.
tantivy = { version = "0.26", default-features = false }
thiserror = "2"
unicode-normalization = "0.1"

# Network interfaces' addresses, to advertise in links.
if-addrs = "0.15"
# UPnP-IGD port mapping over tokio.
igd-next = { version = "0.18", default-features = false, features = ["aio_tokio"] }
# The default gateway, which NAT-PMP and PCP requests go to.
netdev = { version = "0.46", default-features = false, features = ["gateway"] }
# Free disk space, before laying out a download.
fs4 = { version = "1.1", default-features = false, features = ["sync"] }
# For O_NOFOLLOW when opening downloaded files.
libc = "0.2"
# Raising the limit on open files without unsafe code.
rustix = { version = "1", default-features = false, features = ["process", "std"] }
pem-rfc7468 = { version = "1", features = ["std"] }
# QUIC over tokio with rustls on ring (D-018, D-084); no platform certificate verifier, since
# peers authenticate with raw public keys (D-020).
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# `all` for SO_REUSEPORT, so several clients on one machine can listen for LAN discovery.
socket2 = { version = "0.6", features = ["all"] }

# HTTP for trackers (D-043): axum serves, reqwest asks. Both use only HTTP/1.1 and tokio; reqwest
# gets rustls on ring with the platform's certificate verifier, like the rest of the TLS stack.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
# The tracker serves its routes through hyper itself, for timeouts and a connection cap that
# axum::serve doesn't offer.
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["http1", "server", "server-graceful", "service", "tokio"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls-platform-verifier = "0.7"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }

hex = "0.4"
proptest = "1"
tempfile = "3"
# HTTPS for the engine API's remote access (D-125): a self-signed certificate when none is
# configured, and TLS over tokio, both on ring.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# Streams for the engine API's server-sent events.
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# The terminal UI, drawing through crossterm (D-090).
ratatui = "0.30"
# Display widths, for cutting names to fit the terminal UI's columns.
unicode-width = "0.2"
# Snapshot tests of the terminal UI's screens.
insta = "1"

# The web UIs (D-117), client-side rendered to WebAssembly. Leptos stays on 0.8.
leptos = "0.8"
web-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-test = "0.3"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
# Browser behavior for the UI kit's controls, such as clicks outside a popup (D-219).
leptos-use = { version = "0.19", default-features = false, features = ["on_click_outside", "use_event_listener"] }
# Lets components clean up browser objects, which aren't Send, in Leptos's cleanups.
send_wrapper = "0.6"

# Calls an axum router directly in tests, without a socket.
tower = { version = "0.5", default-features = false, features = ["util"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Leftovers from debugging and unfinished code.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

# Line tables keep backtraces useful at a fraction of full debug info's disk use.
[profile.dev]
debug = "line-tables-only"

# Dependencies' debug info is never used: our backtraces only need our own crates' line tables.
[profile.dev.package."*"]
debug = false

# Hashing dominates test time in unoptimized builds; optimizing it keeps swarm tests fast.
[profile.dev.package.sha2]
opt-level = 3

# DuckDB is C++: debug info makes its objects take gigabytes, and unoptimized it appends slowly.
[profile.dev.package.libduckdb-sys]
opt-level = 2

# The web UIs' WebAssembly, built by trunk (`--cargo-profile web`) to embed in the binary: small
# rather than fast, which its work never needs.
[profile.web]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# Releases, built by dist. One codegen unit and no symbol table make `tempest` about 40%
# smaller for about 40% more build time; panic messages still name their source line.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = "symbols"
