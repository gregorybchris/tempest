[graph]
all-features = true

[advisories]
version = 2

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]
# encoding_rs (through serde-saphyr) includes WHATWG encoding data under BSD-3-Clause.
exceptions = [{ allow = ["BSD-3-Clause"], crate = "encoding_rs" }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
