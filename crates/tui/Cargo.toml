[package]
name = "tempest-tui"
description = "Tempest's terminal UI, a client of the engine's API"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
tempest-api = { workspace = true, features = ["client"] }
tempest-protocol.workspace = true

ratatui.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
unicode-width.workspace = true

[dev-dependencies]
tempest-api = { workspace = true, features = ["client", "testing"] }
tempest-engine.workspace = true
insta.workspace = true
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
