name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo nextest run --workspace
      - run: cargo test --workspace --doc

  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p tempest
      # The same seed must replay the same event log (D-068), in a fresh process and whatever
      # the number of threads.
      - name: Determinism check
        run: |
          for scenario in swarm-1000 golden home-routers; do
            path=crates/sim/scenarios/$scenario.yaml
            target/release/tempest sim run "$path" --no-db --digests "$scenario-1.tsv"
            target/release/tempest sim run "$path" --no-db --digests "$scenario-2.tsv" --jobs 1
            cmp "$scenario-1.tsv" "$scenario-2.tsv"
            cat "$scenario-1.tsv"
          done
      # The slow tests, among them the 1,000-peer swarm into DuckDB and the validation scenarios,
      # and the golden baseline over every saved seed.
      - name: Slow simulation tests
        run: cargo test --release -p tempest-sim -- --include-ignored
        env:
          TEMPEST_BASELINE_SEEDS: 20

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Run each fuzz target briefly
        working-directory: fuzz
        run: |
          targets=$(cargo +nightly fuzz list)
          test -n "$targets"
          # The prebuilt cargo-fuzz is a musl binary that defaults to its own target.
          host=$(rustc +nightly -vV | sed -n 's/^host: //p')
          for target in $targets; do
            cargo +nightly fuzz run --target "$host" "$target" -- -max_total_time=30
          done
