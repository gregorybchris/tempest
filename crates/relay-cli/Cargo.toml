[package]
name = "tempest-relay-cli"
description = "tempest-relay, Tempest's relay: lends public addresses to peers behind routers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "tempest-relay"
path = "src/main.rs"

# Operators run servers on Unix, so there is no Windows build or MSI.
[package.metadata.dist]
dist = true
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
installers = ["shell"]

[dependencies]
tempest-net.workspace = true
tempest-protocol.workspace = true
tempest-relay.workspace = true

anyhow.workspace = true
clap.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
