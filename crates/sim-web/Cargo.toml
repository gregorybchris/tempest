[package]
name = "tempest-sim-web"
description = "Tempest's simulation results UI, served by `tempest-sim web`"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
tempest-sim-api.workspace = true
tempest-ui-kit.workspace = true

console_error_panic_hook.workspace = true
leptos = { workspace = true, features = ["csr"] }
serde.workspace = true
web-sys = { workspace = true, features = [
  "Document",
  "Element",
  "HtmlElement",
  "HtmlInputElement",
  "KeyboardEvent",
  "Storage",
  "Window",
] }

[lints]
workspace = true
