[project]
authors = [
    { name = "Chris Gregory", email = "christopher.b.gregory@gmail.com" },
]
dependencies = ["loguru>=0.7.3", "rich>=15.0.0", "typer>=0.27.0"]
description = "A tempest project."
keywords = ["tempest"]
license = "Apache-2.0"
name = "tempest"
readme = "README.md"
requires-python = ">=3.14"
version = "0.1.0"

[project.scripts]
tempest = "tempest.cli:main"

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.0", "ty>=0.0.63"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/tempest"]

[project.urls]
repository = "https://github.com/gregorybchris/tempest"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ty.environment]
python-version = "3.14"

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
# TC001/TC003: typing-only imports deliberately stay at runtime. `collections.abc`
# costs 0.001 ms to import, and keeping it out of a TYPE_CHECKING block is what makes
# get_type_hints() and inspect.signature() work.
ignore = ["D100", "D104", "FIX002", "TC001", "TC003", "TD002", "TD003"]
select = [
    "A",
    "ARG",
    "B",
    "BLE",
    "C4",
    "E",
    "EM",
    "ERA",
    "F",
    "FIX",
    "G",
    "I",
    "ICN",
    "ISC",
    "LOG",
    "N",
    "PL",
    "PT",
    "PTH",
    "PLR",
    "RET",
    "RUF",
    "S",
    "SIM",
    "SLF",
    "T20",
    "TC",
    "TD",
    "TID",
    "W",
]

[tool.ruff.lint.extend-per-file-ignores]
"**/*.py" = ["A001", "A002", "PLR0912", "PLR0915", "PLR0913", "T201", "T203"]
# Tests: asserts are the point (S101), and magic numbers are clearer inline (PLR2004).
# S311: seeded `random` is exactly what makes these statistical tests reproducible.
"**/tests/**/*.py" = ["SLF", "PLR2004", "PLR6301", "S101", "S311"]
