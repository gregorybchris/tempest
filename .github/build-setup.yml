# Runs before dist builds the binaries: the client web UI is embedded in `tempest` (D-201).
- name: Install trunk and the WebAssembly target
  shell: bash
  run: |
    rustup target add wasm32-unknown-unknown
    cargo install trunk --locked
- name: Build the web UI
  shell: bash
  run: cd crates/web && trunk build --release --cargo-profile web
