[package]
name = "dioxus-app"
version = "0.1.0"
edition = "2021"
description = "M0 prototype: Tempest UI in Dioxus (WASM, web renderer), built with trunk"

[workspace]

[dependencies]
proto-core = { path = "../proto-core" }
dioxus = { version = "=0.7.10", default-features = false, features = ["web", "minimal", "mounted"] }
gloo-timers = { version = "0.3", features = ["futures"] }
gloo-events = "0.2"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["DomRect", "Element", "HtmlElement", "KeyboardEvent", "MouseEvent", "PointerEvent", "Window", "Document", "EventTarget"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
