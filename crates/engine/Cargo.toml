[package]
name = "tempest-engine"
description = "Tempest's engine: transfers, their saved state, and the client's config"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
tempest-api = { workspace = true, features = ["axum"] }
tempest-tracker-api.workspace = true
tempest-core.workspace = true
tempest-http.workspace = true
tempest-net.workspace = true
tempest-protocol.workspace = true

axum = { workspace = true, features = ["query"] }
chrono.workspace = true
futures-util.workspace = true
getrandom.workspace = true
rcgen.workspace = true
rusqlite.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-saphyr = { workspace = true, features = ["serialize"] }
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process"] }
tokio-rustls.workspace = true
tracing.workspace = true
unicode-normalization.workspace = true

[dev-dependencies]
tempest-api = { workspace = true, features = ["client"] }
proptest.workspace = true
tempest-relay.workspace = true
tempest-tracker.workspace = true
