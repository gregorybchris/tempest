# D-223's check: does superseeding slow a 1:1 send, when off, always on and only while a crowd
# wants the bundle? Results are in specs/decisions.md (D-223).
name: superseed-direct
description: An origin sends a release to one downloader 100 ms away, at three upload rates.
duration: 10m
seeds: 3
bundle: { files: [{ size: 64MiB }] }
network: { latency: 25ms }
peers:
  - class: origin
    starts: complete
    bandwidth: { up: 100Mbps, down: 1Gbps }
  - class: downloader
    bandwidth: { up: 20Mbps, down: 1Gbps }
experiment:
  vary:
    peers.origin.bandwidth.up: [20Mbps, 100Mbps, 1Gbps]
    peers.origin.settings.strategies.superseed: [off, on, crowd]
