# D-223's check: how much superseeding saves when a crowd fetches a release from an origin whose
# upload is the bottleneck, arriving at once or within a minute, with superseeding off, always on
# and only while a crowd wants the bundle. Results are in specs/decisions.md (D-223).
name: superseed-crowd
description: 100 home peers fetch a release from an origin with half their upload.
duration: 1h
seeds: 3
bundle: { files: [{ size: 32MiB }] }
network: { latency: 25ms }
peers:
  - class: origin
    starts: complete
    bandwidth: { up: 5Mbps, down: 100Mbps }
  - class: home
    count: 100
    bandwidth: { up: 10Mbps, down: 50Mbps }
experiment:
  vary:
    peers.home.arrivals:
      - { pattern: at-once }
      - { pattern: flash-crowd, decay: 1m }
    peers.origin.settings.strategies.superseed: [off, on, crowd]
