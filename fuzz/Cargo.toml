[package]
name = "tempest-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
libfuzzer-sys = "0.4"
serde = "1"
serde_json = "1"
tempest-protocol = { path = "../crates/protocol" }

# Keep the fuzz crate out of the main workspace: it builds only on nightly.
[workspace]
members = ["."]

[[bin]]
name = "frame"
path = "fuzz_targets/frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "primitives"
path = "fuzz_targets/primitives.rs"
test = false
doc = false
bench = false

[[bin]]
name = "verify_data"
path = "fuzz_targets/verify_data.rs"
test = false
doc = false
bench = false

[[bin]]
name = "manifest"
path = "fuzz_targets/manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "link"
path = "fuzz_targets/link.rs"
test = false
doc = false
bench = false

[[bin]]
name = "message"
path = "fuzz_targets/message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lan"
path = "fuzz_targets/lan.rs"
test = false
doc = false
bench = false

[[bin]]
name = "relay_frame"
path = "fuzz_targets/relay_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "relay_datagram"
path = "fuzz_targets/relay_datagram.rs"
test = false
doc = false
bench = false

[[bin]]
name = "relay_identity"
path = "fuzz_targets/relay_identity.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tracker_json"
path = "fuzz_targets/tracker_json.rs"
test = false
doc = false
bench = false
