[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gregorybchris/tempest"
rust-version = "1.85"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Settings for the `dist` release builds.
[profile.dist]
inherits = "release"
lto = "thin"
